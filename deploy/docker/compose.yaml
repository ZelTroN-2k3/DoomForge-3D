services:
  sketchforge:
    image: cadverix-3d:local
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    ports:
      - "${CADVERIX_PORT:-${SKETCHFORGE_PORT:-3000}}:3000"
    environment:
      CADVERIX_SHARED_PROJECTS_DIR: /data/projects
      CADVERIX_UPDATE_TRIGGER_URL: "${CADVERIX_UPDATE_TRIGGER_URL:-${SKETCHFORGE_UPDATE_TRIGGER_URL:-}}"
      CADVERIX_UPDATE_ADMIN_KEY: "${CADVERIX_UPDATE_ADMIN_KEY:-${SKETCHFORGE_UPDATE_ADMIN_KEY:-}}"
      CADVERIX_UPDATE_TRIGGER_TOKEN: "${CADVERIX_UPDATE_TRIGGER_TOKEN:-${SKETCHFORGE_UPDATE_TRIGGER_TOKEN:-}}"
    volumes:
      - "${CADVERIX_SHARED_PROJECTS_VOLUME:-${SKETCHFORGE_SHARED_PROJECTS_VOLUME:-sketchforge-shared-projects}}:/data/projects"
    restart: unless-stopped

volumes:
  sketchforge-shared-projects:
