appId: com.sketchforge.desktop
productName: Cadverix 3D
asar: true
afterPack: apps/desktop/after-pack.cjs

directories:
  output: dist/desktop

publish:
  provider: github
  owner: WC3D
  repo: Cadverix-3D
  releaseType: release

files:
  - apps/desktop/main.cjs
  - apps/desktop/preload.cjs
  - scripts/cadverix-mcp-server.mjs
  - package.json

extraResources:
  - from: apps/web/.next/standalone
    to: web
  - from: apps/web/.next/static
    to: web/apps/web/.next/static
  - from: apps/web/public
    to: web/apps/web/public

win:
  icon: apps/web/public/assets/cadverix/cadverix-logo.png
  target:
    - target: nsis
      arch:
        - x64
  artifactName: Cadverix-3D-Setup-${version}-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

mac:
  icon: apps/web/public/assets/cadverix/cadverix-logo.png
  target:
    - dmg
    - zip
  category: public.app-category.graphics-design
  artifactName: Cadverix-3D-${version}-${arch}.${ext}

linux:
  syncDesktopName: true
  icon: apps/web/public/assets/cadverix/cadverix-logo.png
  target:
    - AppImage
  category: Graphics
  artifactName: Cadverix-3D-${version}-${arch}.${ext}
